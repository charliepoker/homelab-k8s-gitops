
# Exposes argocd-server (HTTP, insecure mode) at https://argocd.webdemoapp.com
# TLS is terminated at homelab-gateway (webdemoapp-tls cert, argocd SAN).


# ---- Route 1: redirect plain HTTP to HTTPS ---------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-redirect
  namespace: argocd
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: envoy-gateway-system
      sectionName: http          # the port-80 listener
  hostnames:
    - argocd.webdemoapp.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301

---
# ---- Route 2: HTTPS traffic to argocd-server -------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: envoy-gateway-system
      sectionName: https         # the port-443 listener (terminates webdemoapp-tls)
  hostnames:
    - argocd.webdemoapp.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: argocd-server
          port: 80