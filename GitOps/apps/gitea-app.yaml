# =============================================================================
# This ArgoCD Application manifest deploys Gitea using the official Helm chart.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  project: default

  sources:
    - repoURL: https://dl.gitea.com/charts/
      chart: gitea
      targetRevision: "12.6.0"
      helm:
        valueFiles:
          - $values/gateway-migration/gitea/values.yaml

    # --- Source 2: values from your Gitea homelab-gitops repo ---
    - repoURL: https://gitea.webdemoapp.com/homelab-devops/homelab-gitops.git
      targetRevision: HEAD
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: gitea

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # Gitea has a PostgreSQL StatefulSet — if ArgoCD sees a diff on the
      # PVC (which it can't modify), ReplaceResource avoids an error.
      - RespectIgnoreDifferences=true
    # Leave manual sync for gitea — you don't want an accidental values
    # change to restart Gitea while ArgoCD is using it as a Git source.
    # automated:
    #   prune: true
    #   selfHeal: true

  # Ignore fields that Kubernetes mutates at runtime (StatefulSet status,
  # PVC capacity rounding, etc.) so ArgoCD doesn't show perpetual drift.
ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates/0/status
        - /metadata/labels/app.kubernetes.io~1managed-by
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /metadata/labels/app.kubernetes.io~1managed-by

        