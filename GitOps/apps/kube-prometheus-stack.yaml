# =============================================================================
# kube-prometheus-stack — Prometheus, Alertmanager, Grafana, kube-state-metrics,
# node-exporter, prometheus-operator. Pi-tuned values in
# gateway-migration/monitoring/values.yaml.
#
# Release name pinned to `kube-prom` so existing services like
# `kube-prom-grafana` (referenced by the Grafana HTTPRoute) keep working.
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: homelab
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 86.2.3            
      helm:
        releaseName: kube-prom                   # MUST match existing release
        valueFiles:
          - $values/gateway-migration/monitoring/values.yaml
        skipCrds: false
    - repoURL: https://gitea.webdemoapp.com/homelab-devops/homelab-gitops.git
      targetRevision: HEAD
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
  ignoreDifferences:
    # CRDs ship via the chart; k8s mutates these fields post-apply
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /metadata/labels
        - /metadata/annotations
        - /status
    # StatefulSet PVC fields k8s won't let you change
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /spec/volumeClaimTemplates/0/status
        - /spec/volumeClaimTemplates/0/apiVersion
        - /spec/volumeClaimTemplates/0/kind
    # Operator mutates these after creation
    - group: monitoring.coreos.com
      kind: Prometheus
      jsonPointers:
        - /status
    - group: monitoring.coreos.com
      kind: Alertmanager
      jsonPointers:
        - /status