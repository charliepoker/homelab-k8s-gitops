apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts-config
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  project: homelab
  source:
    repoURL: https://gitea.webdemoapp.com/homelab-devops/homelab-gitops.git
    targetRevision: HEAD
    path: GitOps/argo-rollouts        # syncs the ConfigMap above (and any future rollouts platform config)
  destination:
    server: https://kubernetes.default.svc
    namespace: argo-rollouts          # ConfigMap lands in the controller's namespace
  syncPolicy:
    syncOptions:
      - CreateNamespace=false         # argo-rollouts ns already exists from the Helm install
    automated:
      prune: true
      selfHeal: true