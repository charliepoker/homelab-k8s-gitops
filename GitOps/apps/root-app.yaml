# =============================================================================
# App-of-Apps root Application  ·  GitOps/apps/root-app.yaml
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homelab
spec:
  project: homelab

  # Single source — plain YAML directory, not Helm.
  source:
    repoURL: https://gitea.webdemoapp.com/homelab-devops/homelab-gitops.git
    targetRevision: HEAD
    path: GitOps/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd           

  syncPolicy:
    automated:
      selfHeal: true           
      prune: false             
    syncOptions:
      - CreateNamespace=false