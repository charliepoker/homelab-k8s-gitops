apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: podinfo-image-updater
  namespace: argocd
spec:
  # Where to write the new tag (declarative git write-back to Gitea)
  writeBackConfig:
    method: "git:secret:argocd/gitea-image-updater"   # the secret from step 2
    gitConfig:
      repository: "https://gitea.webdemoapp.com/homelab-devops/homelab-gitops.git"
      branch: "main"                                   
    writeBackTarget: "helmvalues:/gateway-migration/podinfo/values.yaml"

  applicationRefs:
    - namePattern: "podinfo"            
      images:
        - alias: "podinfo"
          imageName: "ghcr.io/charliepoker/podinfo"
          commonUpdateSettings:
            updateStrategy: "newest-build"             
            allowTags: "regexp:^sha-[0-9a-f]{40}$"     
          manifestTargets:
            helm:
              name: image.repository                   
              tag: image.tag                           