---
# HTTP → HTTPS redirect for webdemoapp.com and www
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wordpress-http-redirect
  namespace: wordpress
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - webdemoapp.com
    - www.webdemoapp.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# HTTPS route to WordPress service
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wordpress-https
  namespace: wordpress
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - webdemoapp.com
    - www.webdemoapp.com
  rules:
    - backendRefs:
        - name: wordpress-service   
          port: 80
