---
# HTTP → HTTPS redirect for podinfo.webdemoapp.com
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo-http-redirect
  namespace: podinfo
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - podinfo.webdemoapp.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# HTTPS route to Podinfo service
# NOTE: This file will be modified to add canary traffic weights
#Project 2 Week 6
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: podinfo-https
  namespace: podinfo
spec:
  parentRefs:
    - name: homelab-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - podinfo.webdemoapp.com
  rules:
    - backendRefs:
        - name: podinfo
          port: 9898
