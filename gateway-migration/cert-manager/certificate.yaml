apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: homelab-tls
  namespace: envoy-gateway-system
spec:
  secretName: webdemoapp-tls
  duration: 2160h       # 90 days
  renewBefore: 720h     # Renew 30 days before expiry
  issuerRef:
    name: letsencrypt-prod      # Promoted from staging
    kind: ClusterIssuer
  dnsNames:
    - webdemoapp.com
    - www.webdemoapp.com
    - gitea.webdemoapp.com
    - podinfo.webdemoapp.com
    - argocd.webdemoapp.com
    - grafana.webdemoapp.com
    - coder.webdemoapp.com